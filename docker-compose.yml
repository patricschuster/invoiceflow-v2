version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: invoiceflow_db
    environment:
      POSTGRES_DB: invoiceflow
      POSTGRES_USER: invoiceflow
      POSTGRES_PASSWORD: einSicheresPasswort123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoiceflow_backend
    environment:
      DATABASE_URL: postgresql://invoiceflow:${DB_PASSWORD:-einSicheresPasswort123!}@postgres:5432/invoiceflow
      DATA_PATH: /app/data
      PAPERLESS_URL: ${PAPERLESS_URL:-http://paperless:8000}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      WATCHER_API_KEY: ${WATCHER_API_KEY:-change-me-watcher-key}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-password}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
    ports:
      - "9500:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invoiceflow_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:9500}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000

  file-watcher:
    build:
      context: ./file-watcher
      dockerfile: Dockerfile
    container_name: invoiceflow_watcher
    environment:
      API_URL: http://backend:8000
      WATCH_PATH: /app/data/incoming
      PROCESSING_PATH: /app/data/processing
      ERROR_PATH: /app/data/error
      WATCHER_API_KEY: ${WATCHER_API_KEY:-change-me-watcher-key}
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
